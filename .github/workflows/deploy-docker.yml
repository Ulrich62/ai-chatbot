name: Deploy to VPS with Docker (Dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # Set variables
            IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            CONTAINER_NAME="ai-chatbot-dev"
            COMPOSE_FILE="/home/denemlabs/ai-chatbot/docker-compose.yml"

            # Create app directory
            mkdir -p /home/denemlabs/ai-chatbot

            # Navigate to app directory
            cd /home/denemlabs/ai-chatbot

            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull latest image
            echo "Pulling latest image..."
            docker pull $IMAGE_NAME:dev || docker pull $IMAGE_NAME:latest

            # Stop and remove existing container
            echo "Stopping existing container..."
            docker stop $CONTAINER_NAME 2>/dev/null || true
            docker rm $CONTAINER_NAME 2>/dev/null || true

            # Remove old images (keep last 3)
            echo "Cleaning up old images..."
            docker images $IMAGE_NAME --format "table {{.Tag}}\t{{.ID}}" | grep -v "TAG" | tail -n +4 | awk '{print $2}' | xargs -r docker rmi 2>/dev/null || true

            # Create environment file
            echo "Creating environment file..."
            cat > .env.production << EOF
            # Office SSO Configuration
            AUTH_API_BASE_URL=${{ secrets.AUTH_API_BASE_URL }}
            OFFICE_BASE_URL=${{ secrets.OFFICE_BASE_URL }}
            OFFICE_APP_NAME=${{ secrets.OFFICE_APP_NAME }}
            HTTP_SIGNATURE_SECRET=${{ secrets.HTTP_SIGNATURE_SECRET }}

            # SSO Office Configuration
            NEXT_PUBLIC_OFFICE_BASE_URL=${{ secrets.NEXT_PUBLIC_OFFICE_BASE_URL }}
            NEXT_PUBLIC_OFFICE_APP_NAME=${{ secrets.NEXT_PUBLIC_OFFICE_APP_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}

            # Public variables
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_BGDS_API_BASE_URL=${{ secrets.NEXT_PUBLIC_BGDS_API_BASE_URL }}
            NEXT_PUBLIC_RAG_API_BASE_URL=${{ secrets.NEXT_PUBLIC_RAG_API_BASE_URL }}
            PASSWORD_RESET_URL=${{ secrets.PASSWORD_RESET_URL }}

            # Production settings
            NODE_ENV=production
            PORT=3000
            HOSTNAME=0.0.0.0
            EOF

            # Create docker-compose override for production
            cat > docker-compose.override.yml << EOF
            version: '3.8'
            services:
              ai-chatbot:
                image: $IMAGE_NAME:dev
                container_name: $CONTAINER_NAME
                restart: unless-stopped
                ports:
                  - "3000:3000"
                environment:
                  - NODE_ENV=production
                  - PORT=3000
                  - HOSTNAME=0.0.0.0
                env_file:
                  - .env.production
                healthcheck:
                  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 40s
            EOF

            # Start the application
            echo "Starting application..."
            docker-compose -f docker-compose.yml -f docker-compose.override.yml up -d

            # Wait for application to start
            echo "Waiting for application to start..."
            sleep 30

            # Health check
            echo "Performing health check..."
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Application is running successfully!"
              docker ps --filter "name=$CONTAINER_NAME"
            else
              echo "❌ Application health check failed!"
              docker logs $CONTAINER_NAME --tail 50
              exit 1
            fi

            # Clean up unused images
            echo "Cleaning up unused Docker resources..."
            docker system prune -f --volumes

            echo "Deployment completed successfully!"

  notify:
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify deployment status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ Deployment successful! Application is running at http://${{ secrets.VPS_HOST }}:3000"
          else
            echo "❌ Deployment failed! Check the logs for details."
          fi
