name: Deploy to VPS (Dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.3'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

      - name: Build application
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Create deployment archive
        run: |
          tar -czf deployment.tar.gz \
            .next \
            public \
            package.json \
            pnpm-lock.yaml \
            next.config.ts \
            tailwind.config.ts \
            postcss.config.mjs \
            tsconfig.json \
            components.json

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # Create app directory if it doesn't exist
            mkdir -p /home/denemlabs/ai-chatbot
            
            # Navigate to app directory
            cd /home/denemlabs/ai-chatbot
            
            # Stop existing application if running
            if pgrep -f "next start" > /dev/null; then
              echo "Stopping existing application..."
              pkill -f "next start"
              sleep 5
            fi
            
            # Backup current deployment
            if [ -d ".next" ]; then
              echo "Backing up current deployment..."
              mv .next .next.backup.$(date +%Y%m%d_%H%M%S)
            fi

      - name: Upload deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "deployment.tar.gz"
          target: "/home/denemlabs/ai-chatbot/"

      - name: Extract and setup on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /home/denemlabs/ai-chatbot
            
            # Extract new deployment
            echo "Extracting new deployment..."
            tar -xzf deployment.tar.gz
            
            # Clean up archive
            rm deployment.tar.gz
            
            # Install dependencies
            echo "Installing dependencies..."
            pnpm install --frozen-lockfile --prod
            
            # Set environment variables
            echo "Setting up environment..."
            cat > .env.production << EOF
            # Office SSO Configuration
            AUTH_API_BASE_URL=${{ secrets.AUTH_API_BASE_URL }}
            OFFICE_BASE_URL=${{ secrets.OFFICE_BASE_URL }}
            OFFICE_APP_NAME=${{ secrets.OFFICE_APP_NAME }}
            HTTP_SIGNATURE_SECRET=${{ secrets.HTTP_SIGNATURE_SECRET }}
            
            # SSO Office Configuration
            NEXT_PUBLIC_OFFICE_BASE_URL=${{ secrets.NEXT_PUBLIC_OFFICE_BASE_URL }}
            NEXT_PUBLIC_OFFICE_APP_NAME=${{ secrets.NEXT_PUBLIC_OFFICE_APP_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            
            # Public variables
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_BGDS_API_BASE_URL=${{ secrets.NEXT_PUBLIC_BGDS_API_BASE_URL }}
            NEXT_PUBLIC_RAG_API_BASE_URL=${{ secrets.NEXT_PUBLIC_RAG_API_BASE_URL }}
            PASSWORD_RESET_URL=${{ secrets.PASSWORD_RESET_URL }}
            
            # Production settings
            NODE_ENV=production
            PORT=3000
            EOF
            
            # Start application with PM2
            echo "Starting application with PM2..."
            pm2 delete ai-chatbot-dev 2>/dev/null || true
            pm2 start npm --name "ai-chatbot-dev" -- start
            pm2 save
            pm2 startup
            
            # Clean up old backups (keep last 3)
            echo "Cleaning up old backups..."
            ls -dt .next.backup.* | tail -n +4 | xargs rm -rf 2>/dev/null || true
            
            echo "Deployment completed successfully!"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # Wait for application to start
            sleep 10
            
            # Check if application is running
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Application is running successfully!"
              pm2 status
            else
              echo "❌ Application health check failed!"
              pm2 logs ai-chatbot-dev --lines 20
              exit 1
            fi
